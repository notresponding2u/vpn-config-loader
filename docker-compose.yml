name: vpnloader
services:
  vpnloader:
    build:
      dockerfile: ./Dockerfile
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    volumes:
      # The path to the folder with your .ovpn configs.
      - ./conf.d:/app/conf.d
    environment:
      TZ: ${VPN_TZ}
      VPN_CONFIG_FILE: ${VPN_CONFIG_FILE}
      VPN_CONFIG_FILE_DIR: ${VPN_CONFIG_FILE_DIR}
      VPN_CONFIG_USERNAME: ${VPN_CONFIG_USERNAME}
      VPN_CONFIG_PASSWORD: ${VPN_CONFIG_PASSWORD}
      WEB_PORT: ${WEB_PORT}
      LOG_LEVEL: ${LOG_LEVEL}

      # LAN networks allowed for established replies
      LAN_CIDRS: "192.168.0.0/16 172.16.0.0/12"

      # Docker network
      DOCKER_SUBNET: "172.30.0.0/16"
    ports:
      - ${WEB_PORT}:${WEB_PORT}
      # Other ports go ehre:
    networks:
      - vpn-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "test", "-f", "/run/vpnloader-firewall-ready"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  wait:
    image: alpine:latest
    command: ["sleep", "infinity"]

    depends_on:
      vpnloader:
        condition: service_healthy
    network_mode: "service:vpnloader"
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 32M

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
