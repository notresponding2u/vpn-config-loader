name: vpnloader
services:
  vpnloader:
    image: notresopnding2u/vpn-config-loader:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    volumes:
      # The path to the folder with your .ovpn configs.
      - ./conf.d:/app/conf.d
    environment:
      TZ: ${VPN_TZ}

      # Initial config .ovpn to be loaded and the credentials for the vpn.
      VPN_CONFIG_FILE: ${VPN_CONFIG_FILE}
      VPN_CONFIG_USERNAME: ${VPN_CONFIG_USERNAME}
      VPN_CONFIG_PASSWORD: ${VPN_CONFIG_PASSWORD}

      # All the ports you want to be accessible for all the Applications 
      # comma separated. 
      FIREWALL_ALLOWED_PORTS: ${WEB_PORT}

      # The port where the application of the vpn-config-loader-will be allowed.
      WEB_PORT: ${WEB_PORT}

      # Log level
      LOG_LEVEL: ${LOG_LEVEL}

      # LAN networks allowed for established replies.
      LAN_CIDRS: "192.168.1.0/24"

      # Docker network
      DOCKER_SUBNET: "172.30.0.0/16"
    ports:
      - ${WEB_PORT}:${WEB_PORT}
      # Other ports go ehre:
    networks:
      - vpn-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "test", "-f", "/run/vpnloader-firewall-ready"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  wait:
    image: alpine:latest
    command: ["sleep", "infinity"]

    depends_on:
      vpnloader:
        condition: service_healthy
    network_mode: "service:vpnloader"
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 32M

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
