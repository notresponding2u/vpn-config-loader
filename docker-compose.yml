name: vpnloader
services:
  vpnloader:
    build:
      #context: loader
      dockerfile: ./Dockerfile
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    restart: unless-stopped
    volumes:
      - /vpn:/vpn
    environment:
      - TZ=${VPN_TZ}
      - VPN_CONFIG_FILE=${VPN_CONFIG_FILE}
      - VPN_CONFIG_FILE_DIR=${VPN_CONFIG_FILE_DIR}
      - VPN_CONFIG_FILES_DIR=${VPN_CONFIG_FILES_DIR}
    ports:
      - :8080:8080
    command: >
      -f ""
      -r 192.168.0.0/16
      -r 172.16.0.0/12
    networks:
      - torrent-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 128M

networks:
  torrent-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
